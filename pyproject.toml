[project]
name = "onepassword"
version = "2.0.5"
description = "CLI wrapper for 1Password v2"
readme = "README.md"
license = "MIT"
authors = [
    { name = "David Brown", email = "forums@smurfless.com" },
]
requires-python = ">=3.10"
dependencies = [
    "wget>=3.2,<4.0",
    "pyyaml>=6.0,<7.0",
    "pycryptodome>=3.19.1,<4.0",
    "pexpect>=4.8.0,<5.0",
]

[dependency-groups]
dev = [
    "black>=24.3.0,<25.0",
    "invoke>=2.2,<3.0",
    "keyring>=23.11.0,<24.0",
    "pytest>=9.0.3,<10.0",
    "tox>=3.27.1,<4.0",
    "twine>=4.0.1,<5.0",
]

[[tool.uv.index]]
name = "gitea"
url = "http://sinus.smurfless.com:3000/api/packages/smurfless1/pypi/simple"
publish-url = "http://sinus.smurfless.com:3000/api/packages/smurfless1/pypi"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["onepassword"]
